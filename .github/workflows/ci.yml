# CI gate, two jobs on every PR and on every push to main:
#   - `verify` runs `npm run verify` (typecheck:scripts + vitest + lint).
#   - `actionlint` lints every workflow under .github/workflows/ (honouring
#     .github/actionlint.yaml), so a broken workflow fails here even when the
#     author has no local actionlint — `flow-pre-commit` skips it when absent.
# This is the server-side backstop for the local-only `flow-pre-commit` gate —
# a human pushing a PR outside `/flow-pipeline` never invokes that gate, and an
# in-pipeline run can pass falsely when the PATH-symlinked binary executes
# stale pre-edit code.
#
# Recommended: make both jobs required status checks (via a branch ruleset, or
# classic branch protection) on `main` so red PRs cannot be merged. The status
# checks to select are the job names `verify` and `actionlint` (GitHub may
# display them as `CI / verify` and `CI / actionlint` in the PR checks tab).
# See AGENTS.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded PR runs; never cancel an in-flight push-to-main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # The vitest suite spawns `bun` directly as a subprocess
      # (bin/flow-pre-commit.test.ts, bin/flow-new-worktree.test.ts), so the
      # runner needs Bun on PATH even though `verify` is an npm script.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least-privilege: this job only checks out and lints — it never writes.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No first-party actionlint action exists (rhysd/actionlint ships no
      # action.yml) and every `uses:` here is SHA-pinned, so install the
      # release binary directly, pinned by version AND verified against the
      # upstream SHA256 (actionlint_<ver>_checksums.txt). The upstream
      # download-actionlint.bash does no checksum verification. shellcheck is
      # preinstalled on ubuntu-latest, so `run:` shell is linted too. With no
      # file args, actionlint discovers every .github/workflows/*.yml.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
